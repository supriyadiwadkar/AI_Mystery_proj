services:
  - type: web
    name: ai-mystery-room
    runtime: node
    plan: standard
    buildCommand: npm install && npm run build
    startCommand: node server/dist/server.js
    healthCheckPath: /api/health
    disk:
      name: mystery-storage
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORAGE_DIR
        value: /var/data
      - key: GEMINI_MOCK
        value: "true"
      - key: GENERATION_ENABLED
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
